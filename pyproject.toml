[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-resilience-crew"
version = "0.1.0"
description = "CrewAI multi-agent climate-adaptive agricultural market intelligence for Kenyan counties"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.15,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["crewai[anthropic]>=1.15,<2"]
google = ["crewai[google-genai]>=1.15,<2"]
tools = ["crewai-tools[mcp]>=1.15"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agri-crew = "agri_resilience_crew.__main__:cli"

[tool.setuptools.packages.find]
include = ["agri_resilience_crew*"]

[tool.setuptools.package-data]
agri_resilience_crew = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:crewai.*", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
