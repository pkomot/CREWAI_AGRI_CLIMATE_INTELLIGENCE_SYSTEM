name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      county:
        description: County to plan for
        default: Nakuru
      crops:
        description: Comma-separated crops
        default: Irish Potatoes,Maize

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      CREWAI_TRACING_ENABLED: "false"
      CREWAI_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - run: pytest -q

  playbook:
    name: Generate playbook
    needs: test
    runs-on: ubuntu-latest
    env:
      CREWAI_TRACING_ENABLED: "false"
      CREWAI_DISABLE_TELEMETRY: "true"
      AGRI_CREW_MODE: mock
      # Runs the full crew when the secret is configured; otherwise the offline engine.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[anthropic]"
      - name: Run
        shell: bash
        run: |
          IFS=',' read -ra CROPS <<< "${{ inputs.crops || 'Irish Potatoes,Maize' }}"
          args=(); for c in "${CROPS[@]}"; do args+=(--crop "$c"); done
          python -m agri_resilience_crew --county "${{ inputs.county || 'Nakuru' }}" "${args[@]}" > playbook.json
          { echo '```json'; cat playbook.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: playbook
          path: playbook.json
